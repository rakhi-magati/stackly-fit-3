<!DOCTYPE html>
<html lang="en" data-mode="login"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D1B17"><title>Log in — StacklyFit</title>
<script>document.documentElement.dataset.mode = location.hash === "#signup" ? "signup" : "login"</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css"></head>
<body>
<main class="auth">
<div class="auth-img"><img src="assets/images/hero-strength.jpg" alt=""><i class="sun"></i><i class="ring"></i></div>
<a class="home-brand" href="index.html"><span class="mark"><svg viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12h9l4-9 6 18 5-13 3 4h9"/></svg></span><span>stacklyfit</span></a>
<section class="auth-card" aria-labelledby="formTitle">
<header class="auth-heading"><h1 id="formTitle">Welcome back</h1><p id="formSubtitle">Log in to continue your journey.</p></header>
<div class="auth-tabs" role="tablist" aria-label="Account access"><i class="slider"></i>
<button class="tab" id="loginTab" type="button" role="tab" aria-selected="true">Log in</button>
<button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">Sign up</button></div>
<form id="authForm" novalidate>
<div class="name-row"><div class="field" id="firstNameField"><label class="visually-hidden" for="firstName">First name</label><input id="firstName" name="firstName" type="text" placeholder="First name" autocomplete="given-name"><small class="error"></small></div>
<div class="field" id="lastNameField"><label class="visually-hidden" for="lastName">Last name</label><input id="lastName" name="lastName" type="text" placeholder="Last name" autocomplete="family-name"><small class="error"></small></div></div>
<div class="field"><label class="visually-hidden" for="email">Email address</label><input id="email" name="email" type="email" placeholder="Email address" autocomplete="email"><small class="error"></small></div>
<div class="field password-field"><label class="visually-hidden" for="password">Password</label><input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password">
<button class="show-password" id="togglePassword" type="button" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="slash" d="m4 4 16 16"/></svg></button><small class="error"></small></div>
<div class="field" id="confirmField"><label class="visually-hidden" for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password"><small class="error"></small></div>
<div class="form-options" id="signupOptions"><label class="terms"><input type="checkbox" id="terms"><span>I agree to <a href="#terms">Terms &amp; Conditions</a></span></label></div>
<div class="form-options login-options" id="loginOptions" hidden><label class="terms"><input type="checkbox" id="remember"><span>Remember me</span></label><button class="link-button" type="button" id="forgotButton">Forgot password?</button></div>
<button class="submit-button" type="submit" id="submitButton" disabled>Log in</button>
<p class="switch-copy" id="switchCopy"></p>
</form>
<div class="divider"><span id="orText">or log in with</span></div>
<div class="social-buttons"><button type="button" class="social-button" data-provider="Google"><span class="google-g">G</span> Continue with Google</button></div>
<p class="support-copy"><a href="mailto:support@stacklyfit.fit">Need help? Contact support</a></p>
<p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
</section></main>
<script src="login.js"></script></body></html>
